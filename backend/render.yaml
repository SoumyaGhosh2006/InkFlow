# ==============================================================================
# InkFlow Render Blueprint Configuration (render.yaml)
# Defines production deployment specification for FastAPI web service & MongoDB
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Web Service: FastAPI Backend
  # ----------------------------------------------------------------------------
  - type: web
    name: inkflow-backend
    runtime: python
    region: oregon
    plan: standard
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_STR
        value: "/api/v1"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: inkflow
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: GROQ_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: GROQ_PRIMARY_MODEL
        value: "openai/gpt-oss-120b"
      - key: GROQ_FALLBACK_MODEL
        value: "openai/gpt-oss-20b"
      - key: GROQ_API_KEY
        sync: false
      - key: PRIMARY_CONNECT_TIMEOUT
        value: "2.5"
      - key: PRIMARY_READ_TIMEOUT
        value: "9.0"
      - key: FALLBACK_CONNECT_TIMEOUT
        value: "2.0"
      - key: FALLBACK_READ_TIMEOUT
        value: "8.0"
      - key: FREE_TIER_DAILY_WORD_LIMIT
        value: "5000"
      - key: FREE_TIER_WEEKLY_WORD_LIMIT
        value: "5000"
      - key: SENTRY_DSN
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173,https://ink-flow-twin.vercel.app,https://inkflow.tech,https://www.inkflow.tech,https://inkflow.app"
